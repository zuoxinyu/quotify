[notifications]
enabled = false                       # Master switch; all Windows notifications are off by default
monthly_resets = false                # Notify after a provider's monthly quota reset is detected
weekly_resets = false                 # Notify after a provider's weekly quota reset is detected
five_hour_resets = false              # Notify after a provider's 5-hour quota reset is detected
usage_threshold_enabled = false       # Notify when usage reaches the configured percentage
usage_threshold_percent = 80.0        # Threshold from 1 to 100; inactive while the option above is false
silent_refresh_failures = false       # Notify when a background refresh fails

[provider_budgets]
# Non-sensitive 30-day budgets. Uncomment positive USD amounts as needed.
# If CODEXBAR_BEDROCK_BUDGET is set, unset it before disabling Bedrock's budget here.
# Budget progress is available only when the provider returns actual 30-day USD spend.
# Supported when spend data is available: OpenAI, Claude Admin API, AWS Bedrock,
# DeepInfra, LiteLLM, ClawRouter, ai&, and xAI Management.
# openai = 100.0
# claude = 100.0
# bedrock = 100.0
# xai = 100.0

[network]
proxy = ""                          # Optional explicit proxy: http://127.0.0.1:7890 or socks5://127.0.0.1:7890

[claude]
enabled = true
# auth_file = ""                    # Path to .credentials.json, auto-detected by default
# session_key = ""                  # Optional claude.ai sessionKey or full Cookie header; env: CLAUDE_SESSION_KEY

[codex]
enabled = true
# auth_file = ""                    # Path to codex auth.json, auto-detected by default

[gemini]
enabled = true
api_key = ""                        # Gemini API Key, or leave empty to auto-detect from env GEMINI_API_KEY / GOOGLE_API_KEY

[antigravity]
enabled = true
api_key = ""                        # Reserved; usage requires Antigravity OAuth credentials, not API-key mode
# OAuth credentials: env ANTIGRAVITY_OAUTH_CREDENTIALS_JSON or ~/.codexbar/antigravity/oauth_creds.json

[opencode]
enabled = true
api_key = ""                        # Reserved; OpenCode/OpenCode Go usage is read from an explicit opencode.ai auth cookie
workspace_id = ""                   # Optional wrk_... ID or opencode.ai workspace URL; env: OPENCODE_WORKSPACE_ID / CODEXBAR_OPENCODEGO_WORKSPACE_ID
auth_cookie = ""                    # Optional auth cookie value or full Cookie header; env: OPENCODE_AUTH_COOKIE

